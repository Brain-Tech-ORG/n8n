# Workflow per costruire e pubblicare l'immagine Docker di n8n fork su GitHub Packages
# Questo workflow è ottimizzato per un fork del progetto n8n originale

name: 'Docker Fork: Build and Push to GitHub Packages'

env:
  NODE_OPTIONS: '--max-old-space-size=7168'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  # Build automatico su push al branch main
  push:
    branches:
      - main
      - master
    paths:
      - 'docker/images/n8n/Dockerfile'
      - 'packages/**'
      - '.github/workflows/docker-fork-build-push.yml'

  # Build manuale
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Suffisso per il tag (opzionale)'
        required: false
        type: string
        default: ''
      push_enabled:
        description: 'Pubblica immagine su GitHub Packages'
        required: false
        type: boolean
        default: true

  # Build su release
  release:
    types: [published]

  # Build su PR per test
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'docker/images/n8n/Dockerfile'
      - '.github/workflows/docker-fork-build-push.yml'

jobs:
  determine-build-context:
    name: Determina Contesto Build
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.context.outputs.version_tag }}
      push_enabled: ${{ steps.context.outputs.push_enabled }}
      build_platforms: ${{ steps.context.outputs.build_platforms }}
    steps:
      - name: Determina contesto di build
        id: context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Repository: ${{ github.repository }}"
          
          # Determina versione e tag
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Build da release
            VERSION_TAG="${{ github.event.release.tag_name }}"
            PUSH_ENABLED="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Build manuale
            if [[ -n "${{ inputs.tag_suffix }}" ]]; then
              VERSION_TAG="manual-${{ inputs.tag_suffix }}"
            else
              VERSION_TAG="manual-$(date +%Y%m%d-%H%M%S)"
            fi
            PUSH_ENABLED="${{ inputs.push_enabled }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # Build automatico su push
            BRANCH_NAME="${{ github.ref_name }}"
            SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '/' '-' | tr -cd '[:alnum:]-_')
            VERSION_TAG="${SAFE_BRANCH_NAME}-$(date +%Y%m%d-%H%M%S)"
            PUSH_ENABLED="true"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Build su PR (solo test)
            VERSION_TAG="pr-${{ github.event.pull_request.number }}"
            PUSH_ENABLED="false"
          else
            # Fallback
            VERSION_TAG="dev-$(date +%Y%m%d-%H%M%S)"
            PUSH_ENABLED="false"
          fi
          
          # Piattaforme di build
          BUILD_PLATFORMS="linux/amd64,linux/arm64"
          
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "push_enabled=${PUSH_ENABLED}" >> "$GITHUB_OUTPUT"
          echo "build_platforms=${BUILD_PLATFORMS}" >> "$GITHUB_OUTPUT"
          
          echo "=== Contesto Build ==="
          echo "Version tag: ${VERSION_TAG}"
          echo "Push enabled: ${PUSH_ENABLED}"
          echo "Build platforms: ${BUILD_PLATFORMS}"

  build-and-push:
    name: Build e Push Immagine Docker
    needs: determine-build-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build n8n
        run: pnpm build:n8n

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: needs.determine-build-context.outputs.push_enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.determine-build-context.outputs.version_tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=n8n Fork
            org.opencontainers.image.description=Workflow Automation Tool - Fork di n8n
            org.opencontainers.image.vendor=Fork di n8n-io/n8n
            org.opencontainers.image.licenses=SEE LICENSE IN LICENSE.md

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/images/n8n/Dockerfile
          platforms: ${{ needs.determine-build-context.outputs.build_platforms }}
          push: ${{ needs.determine-build-context.outputs.push_enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=22
            N8N_VERSION=${{ needs.determine-build-context.outputs.version_tag }}
            N8N_RELEASE_TYPE=fork
            GITHUB_REPOSITORY=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image details
        if: needs.determine-build-context.outputs.push_enabled == 'true'
        run: |
          echo "🐳 Immagine Docker pubblicata con successo!"
          echo "📦 Registry: ${{ env.REGISTRY }}"
          echo "🏷️ Repository: ${{ env.IMAGE_NAME }}"
          echo "🔖 Tag: ${{ needs.determine-build-context.outputs.version_tag }}"
          echo ""
          echo "Per utilizzare l'immagine:"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.determine-build-context.outputs.version_tag }}"
          echo ""
          echo "Oppure con il tag latest (se build dal branch principale):"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"